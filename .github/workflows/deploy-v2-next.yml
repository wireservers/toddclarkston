name: Deploy v2-next

on:
  push:
    branches:
      - sot
    paths:
      - "v2-next/**"
      - ".github/workflows/deploy-v2-next.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: toddclarkston.com
            token: AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WATER_0082A151E
          - site: toddclarkston.me
            token: AZURE_STATIC_WEB_APPS_API_TOKEN_RED_FOREST_0E499171E
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[matrix.token] }}
          action: upload
          app_location: v2-next # Next.js hybrid app; API routes run in the managed backend
          api_location: ""
          output_location: ""
