# HTML
# Archive your static HTML project and save it with the build record.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
 branches:
   include:
    - main
 paths:
   include:
     - toddclarkston.com
     
pool: vwsp-app-01

variables:
  projectFolder: '$(build.sourcesDirectory)/toddclarkston.com'

steps:
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(build.sourcesDirectory)/toddclarkston.com'
    includeRootFolder: false

- task: PublishPipelineArtifact@1
  displayName: 'Publish Website Pipeline'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)'
    artifact: 'toddclarkston-artifacts'
